name: Build installers

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build-windows:
    needs: test
    runs-on: windows-latest
    # Needed by the release step below; the default token is read-only on
    # repositories created under the current GitHub defaults.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Produces dist/Arctic PDF Editor-<version>-x64.exe (NSIS installer)
      # and dist/Arctic PDF Editor-<version>-portable.exe.
      - name: Build installer
        run: npm run dist:win
        env:
          # No code-signing certificate is configured; skip signing rather than
          # failing the build. Installs will show a SmartScreen warning.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: arctic-pdf-editor-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/latest.yml

  build-mac:
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Produces a .dmg and a .zip for both Apple Silicon and Intel.
      - name: Build app
        run: npm run dist:mac
        env:
          # No Apple Developer ID is configured, so the app is unsigned: it runs
          # after the user allows it in System Settings, but macOS will complain
          # on first launch. Signing here would fail the build, not fix that.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: arctic-pdf-editor-mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.dmg
