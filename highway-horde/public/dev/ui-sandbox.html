<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <title>UI Sandbox — Highway Horde</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../css/game.css">
  <style>
    .dev-panel {
      position: fixed; right: 8px; bottom: 8px; z-index: 1000; width: 230px; max-height: 70vh; overflow: auto;
      padding: 8px; background: rgba(0, 0, 0, 0.85); border: 1px solid #444; border-radius: 4px;
      font: 12px/1.3 system-ui, sans-serif; color: #ddd;
    }
    .dev-panel h4 { margin: 4px 0; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #ffc400; }
    .dev-panel button { margin: 2px; padding: 3px 6px; font: inherit; background: #222; color: #eee; border: 1px solid #555; border-radius: 3px; cursor: pointer; }
    .dev-panel button:hover { border-color: #ffc400; }
    .dev-panel.min { width: auto; }
    .dev-panel.min .dev-body { display: none; }
  </style>
  <script type="module" src="ui-sandbox.js"></script>
</head>
<body>
  <p id="sandbox-loading" style="color:#888;font:14px system-ui;padding:20px">Loading UI sandbox…</p>
</body>
</html>
