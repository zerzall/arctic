<!doctype html>
<meta charset="utf-8">
<title>Room lab</title>
<style>body{margin:0;background:#222;color:#ddd;font:12px monospace}canvas{image-rendering:pixelated}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js" } }</script>
<canvas id="c" width="512" height="512"></canvas>
<script type="module">
// Dev sandbox for the interior-mapped rooms of world-mat.js: renders hhRoom() over a pane seen
// from a chosen eye position. Params: type, id, lamp, amb, w, h, ex, ey, ez (eye in pane space, world units).
import { INTERIOR_GLSL } from '../js/render3d/world-mat.js';
const q = new URLSearchParams(location.search);
const num = (k, d) => (q.has(k) ? Number(q.get(k)) : d);
const c = document.getElementById('c');
const gl = c.getContext('webgl2');
const vs = `#version 300 es
in vec2 p; out vec2 uv; void main(){ uv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }`;
const fs = `#version 300 es
precision highp float;
in vec2 uv; out vec4 o;
uniform vec3 eye; uniform vec3 base; uniform vec2 sz; uniform float rid, lamp, amb;
${INTERIOR_GLSL}
void main(){
  // pane point in world units, ray from the eye through it into the room (+z)
  vec3 P = vec3(uv.x * sz.x, uv.y * sz.y, 0.0);
  // world-scale coordinates like the game (a pane on a wall facing +z far from the origin), eye ahead of it
  vec3 wP = base + vec3(P.x, P.y, 0.0), wE = base + eye;
  vec3 V = normalize(wP - wE);
  vec3 N = vec3(0.0, 0.0, 1.0);
  vec3 R = normalize(vec3(N.z, 0.0, -N.x));
  vec3 d = vec3(dot(V, R), V.y, dot(V, -N));
  float px = max(fwidth(uv.x), fwidth(uv.y));
  vec3 col = hhRoom(uv, sz, d, rid, lamp, amb, 0.0, px);
  o = vec4(pow(col, vec3(1.0 / 2.2)), 1.0);
}`;
const sh = (t, s) => { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) document.title = 'ERR ' + gl.getShaderInfoLog(x); return x; };
const pr = gl.createProgram();
gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs));
gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(pr);
gl.useProgram(pr);
const b = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, b);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(pr, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const w = num('w', 20), h = num('h', 22);
gl.uniform2f(gl.getUniformLocation(pr, 'sz'), w, h);
gl.uniform3f(gl.getUniformLocation(pr, 'base'), num('bx', 0), num('by', 0), num('bz', 0));
gl.uniform3f(gl.getUniformLocation(pr, 'eye'), num('ex', w / 2), num('ey', h / 2), num('ez', -80));
gl.uniform1f(gl.getUniformLocation(pr, 'rid'), num('type', 0) * 256 + num('id', 7));
gl.uniform1f(gl.getUniformLocation(pr, 'lamp'), num('lamp', 0));
gl.uniform1f(gl.getUniformLocation(pr, 'amb'), num('amb', 0.3));
gl.viewport(0, 0, 512, 512);
gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
document.title = document.title.startsWith('ERR') ? document.title : 'room lab ok';
</script>
